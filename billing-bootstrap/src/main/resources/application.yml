spring:
  application:
    name: billing-platform
  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads (ADR-0009)
  datasource:
    url: jdbc:h2:mem:billing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false              # @Scheduled trigger 만 사용 — 부팅 시 자동 실행 금지
  cache:
    type: caffeine
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:}
    producer:
      acks: all                        # 모든 in-sync replica 가 받았을 때만 ack — 안전성 우선
      retries: 5                       # 일시 broker 장애 시 자동 재시도
      properties:
        enable.idempotence: true       # 동일 메시지 중복 발행 방지 (재시도 시 중복 차단)
        max.in.flight.requests.per.connection: 5  # idempotent producer 의 안전한 상한
    consumer:
      group-id: billing-platform
      enable-auto-commit: false        # 처리 완료 시 명시적 commit (at-least-once)
      auto-offset-reset: earliest      # 새 consumer 는 가장 오래된 메시지부터 (메시지 누락 방지)

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs

resilience4j:
  # 외부 PG (결제 게이트웨이) 호출용 — 슬로우다운 / 장애 시 우리 자원 보호
  circuitbreaker:
    instances:
      pg:
        slidingWindowSize: 20                       # 최근 20번 호출의 결과로 실패율 판정
        minimumNumberOfCalls: 10                    # 최소 10번 호출 누적 후 판정 시작 (초기 노이즈 회피)
        failureRateThreshold: 50                    # 실패율 50% 넘으면 OPEN (호출 차단)
        waitDurationInOpenState: 30s                # OPEN 상태 30초 유지 → 그 후 HALF_OPEN 로 시험
        permittedNumberOfCallsInHalfOpenState: 3    # HALF_OPEN 에서 3번 시험해 회복 여부 판정
  retry:
    instances:
      pg:
        maxAttempts: 3                              # 한 번 호출당 최대 3번 시도
        waitDuration: 200ms                         # 첫 retry 까지 200ms 대기
        enableExponentialBackoff: true              # 점점 간격을 늘려 재시도 (200ms → 400ms → 800ms)
        exponentialBackoffMultiplier: 2
  # ThreadPool Bulkhead — 외부 호출 격리 (ADR-0026). PG 가 슬로우다운되어도 servlet thread pool
  # 까지 cascade 되지 않도록 별도 worker pool 위에서 호출.
  thread-pool-bulkhead:
    instances:
      pg:
        maxThreadPoolSize: 20                       # 최대 동시 PG 호출 수 (Little's law: TPS 10 × latency 0.2s × buffer 10x)
        coreThreadPoolSize: 10                      # 평상시 worker 수
        queueCapacity: 50                           # peak burst 흡수 — 50건 까지 큐. 이 이상이면 BulkheadFullException
        keepAliveDuration: 20ms
      webhook:
        maxThreadPoolSize: 30                       # webhook 발송은 fan-out 이라 PG 보다 큰 풀
        coreThreadPoolSize: 15
        queueCapacity: 100
        keepAliveDuration: 20ms
      audit-export:
        maxThreadPoolSize: 5                        # SIEM export 같은 무거운 IO — 적은 풀로 격리
        coreThreadPoolSize: 2
        queueCapacity: 20
        keepAliveDuration: 20ms

billing:
  pg:
    enabled: false                 # 로컬 dev: 실제 PG 호출 안 하고 MockPgClient 사용
    base-url: ${PG_BASE_URL:http://wiremock:8090}
    bulkhead-enabled: true         # ThreadPoolBulkhead 격리 (ADR-0026). pg.enabled=false 환경에선 어차피 자동 비활성
  outbox:
    relay:
      enabled: false               # 로컬: Kafka 미연결이라 relay 비활성 (테이블 INSERT 만 발생)
      poll-interval-ms: 1000       # 매 1초 마다 outbox 테이블 polling
      batch-size: 100              # 한 polling cycle 에 최대 100건 처리 (메시지 단위 별도 tx)
      send-timeout-ms: 5000        # Kafka send 응답 5초 안에 못 받으면 timeout → 다음 polling 재시도
      topic-prefix: "billing."     # 토픽 명: billing.<aggregateType>.<eventType> (lowercase)
  cache:
    redis-enabled: false           # 로컬: Caffeine 만 (단일 인스턴스 in-memory L1 cache)
    local-ttl-seconds: 30          # L1 (Caffeine, 인스턴스 로컬) 캐시 TTL
    global-ttl-seconds: 300        # L2 (Redis, 인스턴스 공유) 캐시 TTL — prod 에서만 사용
  security:
    jwt:
      enabled: false               # 로컬: PermissiveSecurityConfig (JWT 검증 skip)
  idempotency:
    ttl-hours: 24                  # Idempotency-Key 점유 유지 시간 — 이 안에 같은 키 재시도는 거절
    response-cache-enabled: true   # Stripe 식 응답 캐싱 (24h) — 같은 키 재시도 시 처음 응답 그대로 반환 (ADR-0024)
    cached-paths: /api/v1/payments,/api/v1/refunds   # 응답 캐싱 대상 endpoint (CSV)

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: prod
  # Spring Boot 의 기본 DataSource 자동 구성을 끔 — RoutingDataSourceConfig 가 master/replica 두
  # DataSource 를 직접 만들고 RoutingDataSource 로 묶어서 @Primary 빈으로 등록 (ADR-0025).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  flyway:
    locations: classpath:db/migration,classpath:db/migration-postgres
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}

management:
  tracing:
    sampling:
      probability: 0.1

billing:
  pg:
    enabled: true
  outbox:
    relay:
      enabled: true
  cache:
    redis-enabled: true
  security:
    jwt:
      enabled: true
  datasource:
    # 쓰기 전용 (master) — write 트랜잭션 + write 직후 read.
    master:
      url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:billing}
      username: ${DB_USER:billing}
      password: ${DB_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 30
        pool-name: master-pool
    # 읽기 전용 (replica) — @Transactional(readOnly=true) 흐름이 라우팅됨.
    # DB_REPLICA_HOST 미설정 시 master 와 같은 host (인프라 의존성 줄이기, ADR-0025).
    replica:
      url: jdbc:postgresql://${DB_REPLICA_HOST:${DB_HOST:postgres}}:${DB_REPLICA_PORT:${DB_PORT:5432}}/${DB_NAME:billing}
      username: ${DB_REPLICA_USER:${DB_USER:billing}}
      password: ${DB_REPLICA_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 50         # 조회 트래픽이 많으니 master 보다 큰 pool
        pool-name: replica-pool
        read-only: true               # JDBC level read-only hint — replica 에 대한 안전장치
