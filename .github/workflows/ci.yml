name: Billing Platform CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

# 같은 ref 에서 새 push 가 오면 진행 중이던 run 을 취소 — runner 시간 절약.
# 단 main / tag push 는 image build & push 가 걸려 있어 취소하면 배포 산출물이
# 비는 race 가 생기므로 main 브랜치에서는 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  JAVA_VERSION: "21"

jobs:
  # ─── 1. Test ────────────────────────────────────────────────────
  test:
    name: Unit + slice tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Compile
        run: ./gradlew --no-daemon compileJava compileKotlin compileTestJava

      - name: Run unit tests (domain + application)
        run: ./gradlew --no-daemon :billing-domain:test :billing-application:test

      - name: Coverage report (domain + application, Kover)
        run: ./gradlew --no-daemon koverXmlReport koverLog

      - name: Spring Modulith verification
        run: ./gradlew --no-daemon :billing-bootstrap:test --tests '*ModulithTest'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/reports/kover/

  # ─── 2. Integration tests (Testcontainers) ──────────────────────
  integration-test:
    name: Testcontainers IT
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run e2e Testcontainers
        run: ./gradlew --no-daemon :e2e-tests:test

      - name: Upload e2e reports (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports
          path: |
            e2e-tests/build/reports/tests/**
            e2e-tests/build/test-results/**

  # ─── OpenAPI spec drift gate ─────────────────────────────────────
  # docs/openapi/billing-platform.yaml 은 코드(컨트롤러)에서 생성되는 산출물이다.
  # 기본 프로필(H2 in-memory / Caffeine)은 Postgres / Kafka 같은 외부 인프라 없이
  # 부팅되므로 service container 없이 앱을 띄워 /v3/api-docs.yaml 을 다시 받아
  # commit 된 yaml 과 비교한다. 엔드포인트가 추가·변경됐는데 spec 을 갱신하지 않으면
  # git diff 가 0 이 아니어서 잡이 실패한다 (drift 차단).
  openapi-spec:
    name: OpenAPI spec drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Regenerate OpenAPI spec (zero-infra H2 boot)
        run: |
          set -euo pipefail
          PORT=18080
          ./gradlew --no-daemon :billing-bootstrap:bootRun \
            --args="--server.port=${PORT}" > /tmp/billing-boot.log 2>&1 &
          GRADLE_PID=$!

          # 부팅 대기 — Tomcat 이 포트를 열 때까지 폴링 (최대 ~4분).
          ready=0
          attempt=0
          while [ "${attempt}" -lt 120 ]; do
            if grep -qE "Tomcat started on port ${PORT}|Started BillingApplication" /tmp/billing-boot.log; then
              ready=1; break
            fi
            if ! kill -0 "${GRADLE_PID}" 2>/dev/null; then
              echo "::error::bootRun exited before serving"; break
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          if [ "${ready}" -ne 1 ]; then
            echo "::error::app did not start in time"; tail -n 60 /tmp/billing-boot.log; exit 1
          fi

          # /v3/api-docs.yaml 을 받아 commit 된 위치를 덮어쓴다.
          curl -sf "http://localhost:${PORT}/v3/api-docs.yaml" \
            -o docs/openapi/billing-platform.yaml

          # 앱 종료 — gradle 프로세스 트리 정리.
          kill "${GRADLE_PID}" 2>/dev/null || true
          pkill -f "server.port=${PORT}" 2>/dev/null || true

      - name: Fail on spec drift
        run: |
          if ! git diff --exit-code -- docs/openapi/billing-platform.yaml; then
            echo "::error::docs/openapi/billing-platform.yaml is out of date." \
              "Regenerate locally with ./gradlew :billing-bootstrap:generateOpenApiDocs and commit."
            exit 1
          fi

      - name: Upload boot log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-boot-log
          path: /tmp/billing-boot.log

  # ─── 3. Static analysis (PR only) ───────────────────────────────
  static-analysis:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build (no test)
        run: ./gradlew --no-daemon assemble -x test

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: billing-platform
          path: .
          format: SARIF

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: reports/dependency-check-report.sarif

  # ─── 4. Build container image (push only) ───────────────────────
  build-image:
    name: Build & push container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, integration-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="main-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infrastructure/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/billing-platform:${{ steps.meta.outputs.tag }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/billing-platform:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # ─── Supply-chain: keyless sign + SBOM attestation ─────────────
      # cosign keyless (Sigstore OIDC) 는 id-token: write 와 push 된 digest 가
      # 필요하므로 push 이벤트에서만 동작한다 (이 job 자체가 push 전용).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/billing-platform
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/billing-platform@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM as provenance (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/billing-platform
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE}@${DIGEST}"

  # ─── 5. Helm chart validation ───────────────────────────────────
  # 차트 템플릿이 깨지거나 k8s 스키마에 안 맞는 매니페스트를 내는 회귀를 PR/Push
  # 단계에서 잡는다. lint 는 default + prod 두 values 모두, kubeconform 으로
  # 렌더된 매니페스트를 실제 k8s 스키마 (+ CRD 카탈로그) 에 대조한다.
  helm-validate:
    name: Helm lint + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.7.0
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Helm lint (default values)
        run: helm lint helm/billing-platform

      - name: Helm lint (prod values)
        run: helm lint helm/billing-platform -f helm/billing-platform/values-prod.yaml

      - name: Render + kubeconform (default values)
        run: |
          helm template billing-platform helm/billing-platform \
            | kubeconform -strict -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Render + kubeconform (prod values)
        run: |
          helm template billing-platform helm/billing-platform \
            -f helm/billing-platform/values-prod.yaml \
            | kubeconform -strict -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
