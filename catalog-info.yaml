---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: billing-rest
  description: "결제 / 청구 / 정산 REST API — Wallet 충전, PG 결제, 사용량 metering, invoice / settlement 조회"
  annotations:
    github.com/project-slug: ssa1004/billing-platform
spec:
  type: openapi
  lifecycle: experimental
  owner: user:ssa1004
  system: ssa1004-backend-services
  definition: |
    openapi: 3.0.3
    info:
      title: Billing Platform REST API
      version: 1.0.0
      description: |
        B2B SaaS 결제 / 청구 / 정산 백엔드.
        Wallet / PG 결제 + metering / pricing / invoice / settlement.
        advisory lock + Outbox + DLQ + Spring Batch.
    paths:
      /api/v1/wallets/{tenantId}/charge:
        post:
          summary: Wallet 충전 (PG 결제 후 잔액 증액)
          parameters:
            - in: path
              name: tenantId
              required: true
              schema: { type: string }
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [amount, currency, paymentMethodId, idempotencyKey]
                  properties:
                    amount: { type: integer }
                    currency: { type: string, example: KRW }
                    paymentMethodId: { type: string }
                    idempotencyKey: { type: string }
          responses:
            "200": { description: 충전 완료 (PG 승인 후) }
            "402": { description: 결제 실패 }
      /api/v1/usage:
        post:
          summary: 사용량 metering 이벤트 적재
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [tenantId, metric, quantity, occurredAt]
                  properties:
                    tenantId: { type: string }
                    metric: { type: string, example: api.calls }
                    quantity: { type: number }
                    occurredAt: { type: string, format: date-time }
          responses:
            "202": { description: 적재 완료 }
      /api/v1/invoices/{tenantId}:
        get:
          summary: invoice 목록 (월별 사용량 + 가격)
          parameters:
            - in: path
              name: tenantId
              required: true
              schema: { type: string }
            - in: query
              name: period
              schema: { type: string, example: "2026-05" }
          responses:
            "200": { description: invoice 목록 }
      /api/v1/settlements:
        get:
          summary: 정산 내역 조회 (Spring Batch 일배치 결과)
          responses:
            "200": { description: 정산 내역 }

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: billing-platform-domain-events
  description: "billing 도메인 이벤트 (Outbox + Kafka) — payment.succeeded / payment.failed / invoice.issued / settlement.completed"
  annotations:
    github.com/project-slug: ssa1004/billing-platform
spec:
  type: asyncapi
  lifecycle: experimental
  owner: user:ssa1004
  system: ssa1004-backend-services
  definition: |
    asyncapi: 2.6.0
    info:
      title: Billing Platform Domain Events
      version: 1.0.0
      description: |
        billing-platform 가 Outbox + Kafka 로 발행하는 도메인 이벤트.
        notification-hub 가 구독해 결제 / 청구 알림으로 fan-out.
    channels:
      billing.payment.succeeded:
        subscribe:
          message:
            payload:
              type: object
              required: [eventId, occurredAt, tenantId, paymentId, amount, currency]
              properties:
                eventId: { type: string, format: uuid }
                occurredAt: { type: string, format: date-time }
                tenantId: { type: string }
                paymentId: { type: string }
                amount: { type: integer }
                currency: { type: string }
      billing.payment.failed:
        subscribe:
          message:
            payload:
              type: object
              required: [eventId, occurredAt, tenantId, paymentId, reason]
              properties:
                eventId: { type: string, format: uuid }
                occurredAt: { type: string, format: date-time }
                tenantId: { type: string }
                paymentId: { type: string }
                reason: { type: string }
      billing.invoice.issued:
        subscribe:
          message:
            payload:
              type: object
              required: [eventId, occurredAt, tenantId, invoiceId, totalAmount, period]
              properties:
                eventId: { type: string, format: uuid }
                occurredAt: { type: string, format: date-time }
                tenantId: { type: string }
                invoiceId: { type: string }
                totalAmount: { type: integer }
                period: { type: string }
      billing.settlement.completed:
        subscribe:
          message:
            payload:
              type: object
              required: [eventId, occurredAt, settlementId, totalAmount]
              properties:
                eventId: { type: string, format: uuid }
                occurredAt: { type: string, format: date-time }
                settlementId: { type: string }
                totalAmount: { type: integer }
