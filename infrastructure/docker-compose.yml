services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "billing"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Kafka in KRaft mode (zookeeper-less). 로컬 단일 노드.
  kafka:
    image: bitnamilegacy/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 두 listener 로 분리 — 호스트에서 ./gradlew :billing-bootstrap:bootRun 으로 띄운 앱(localhost:9092)과
      # 컨테이너 내부 서비스(kafka:29092)가 둘 다 붙을 수 있게.
      #   EXTERNAL  : 호스트 → localhost:9092  (통합 데모의 SPRING_KAFKA_BOOTSTRAP_SERVERS=localhost:9092 와 일치)
      #   INTERNAL  : 컨테이너 끼리 → kafka:29092 (broker 간 통신도 INTERNAL)
      # 단일 listener(advertised: kafka:9092)면 호스트가 kafka 호스트명을 못 풀어 Outbox→Kafka 발행이 hang/실패한다.
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Wiremock — PG 시뮬레이션. mappings 디렉토리를 마운트하면 stub 자동 로드.
  wiremock:
    image: wiremock/wiremock:3.10.0-alpine
    ports: ["8090:8080"]
    command: ["--port", "8080", "--verbose"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  # 운영 모드 시뮬레이션 — 위 4개 의존성 모두 구동된 상태에서 billing-platform 자체도 컨테이너로
  # 실제 빌드/실행은 docker compose --profile app up 처럼 profile 분리하면 됨
  billing-app:
    profiles: [app]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_USER: billing
      DB_PASSWORD: billing
      DB_NAME: billing
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092   # 컨테이너 내부 → INTERNAL listener (위 kafka 서비스 참조)
      PG_BASE_URL: http://wiremock:8080
      OAUTH_ISSUER_URI: http://auth.local/dummy
      WALLET_SECURITY_JWT_ENABLED: "false"   # 데모용 — JWT 없이
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      wiremock: { condition: service_started }

  # k6 부하 시나리오 — docker compose --profile load run --rm k6 run /scripts/scenarios/<name>.js.
  # 컨테이너 안에서 호스트의 BASE_URL 을 보려면 host.docker.internal 사용.
  # 본 service 는 단발성 실행 (default command 는 -h 라 그 자체로 종료) —
  # `docker compose --profile load run --rm k6 run /scripts/scenarios/usage-event-ingest.js` 형태로 띄움.
  k6:
    profiles: [load]
    image: grafana/k6:0.50.0
    volumes:
      - ../load/k6:/scripts:ro
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
      K6_TOKEN: ${K6_TOKEN:-}
      K6_CUSTOMERS: ${K6_CUSTOMERS:-}
      K6_SETTLEMENT_CUSTOMERS: ${K6_SETTLEMENT_CUSTOMERS:-}
      K6_PERIOD: ${K6_PERIOD:-}
      K6_PERIODS: ${K6_PERIODS:-}
      K6_CURRENCIES: ${K6_CURRENCIES:-}
      K6_ORDER_IDS: ${K6_ORDER_IDS:-}
      K6_AGED_AS_OF: ${K6_AGED_AS_OF:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["k6"]
    command: ["-h"]

volumes:
  pg-data:
