apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-platform
  namespace: billing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-platform
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # JVM heap 압박 기반 — micrometer + custom adapter 필요 (현재는 CPU only)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # 5분 — flapping 방지
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
