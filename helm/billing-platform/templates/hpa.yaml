{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "billing-platform.fullname" . }}
  labels:
    {{- include "billing-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "billing-platform.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    # JVM heap은 -XX:MaxRAMPercentage=75로 제한하므로 memory 기준 scaling은 사용하지 않는다.
    # working set 이 사실상 limit 의 75% 에 항상 가까움. memory metric 으로
    # scale 하면 minReplicas 위에서 바로 maxReplicas 까지 튀는 사고가 잘 남.
  {{- with .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
