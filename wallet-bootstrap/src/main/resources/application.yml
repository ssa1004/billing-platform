spring:
  application:
    name: wallet-platform
  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads (ADR-0009)
  datasource:
    url: jdbc:h2:mem:wallet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:}
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: wallet-platform
      enable-auto-commit: false
      auto-offset-reset: earliest

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      pg:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      pg:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

wallet:
  pg:
    enabled: false                 # 로컬 dev: MockPgClient 사용
    base-url: ${PG_BASE_URL:http://wiremock:8090}
  outbox:
    relay:
      enabled: false               # 로컬: Kafka 미연결
      poll-interval-ms: 1000
      batch-size: 100
      send-timeout-ms: 5000
      topic-prefix: "wallet."
  cache:
    redis-enabled: false           # 로컬: Caffeine L1 only
    local-ttl-seconds: 30
    global-ttl-seconds: 300
  security:
    jwt:
      enabled: false               # 로컬: PermissiveSecurityConfig
  idempotency:
    ttl-hours: 24

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration,classpath:db/migration-postgres
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}

management:
  tracing:
    sampling:
      probability: 0.1

wallet:
  pg:
    enabled: true
  outbox:
    relay:
      enabled: true
  cache:
    redis-enabled: true
  security:
    jwt:
      enabled: true
