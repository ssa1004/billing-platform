spring:
  application:
    name: billing-platform
  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads (ADR-0009)
  datasource:
    url: jdbc:h2:mem:billing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false              # @Scheduled trigger 만 사용 — 부팅 시 자동 실행 금지
  cache:
    type: caffeine
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:}
    producer:
      acks: all                        # 모든 in-sync replica 가 받았을 때만 ack — 안전성 우선
      retries: 5                       # 일시 broker 장애 시 자동 재시도
      properties:
        enable.idempotence: true       # 동일 메시지 중복 발행 방지 (재시도 시 중복 차단)
        max.in.flight.requests.per.connection: 5  # idempotent producer 의 안전한 상한
    consumer:
      group-id: billing-platform
      enable-auto-commit: false        # 처리 완료 시 명시적 commit (at-least-once)
      auto-offset-reset: earliest      # 새 consumer 는 가장 오래된 메시지부터 (메시지 누락 방지)

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs

resilience4j:
  # 외부 PG (결제 게이트웨이) 호출용 — 슬로우다운 / 장애 시 우리 자원 보호
  circuitbreaker:
    instances:
      pg:
        slidingWindowSize: 20                       # 최근 20번 호출의 결과로 실패율 판정
        minimumNumberOfCalls: 10                    # 최소 10번 호출 누적 후 판정 시작 (초기 노이즈 회피)
        failureRateThreshold: 50                    # 실패율 50% 넘으면 OPEN (호출 차단)
        waitDurationInOpenState: 30s                # OPEN 상태 30초 유지 → 그 후 HALF_OPEN 로 시험
        permittedNumberOfCallsInHalfOpenState: 3    # HALF_OPEN 에서 3번 시험해 회복 여부 판정
  retry:
    instances:
      pg:
        maxAttempts: 3                              # 한 번 호출당 최대 3번 시도
        waitDuration: 200ms                         # 첫 retry 까지 200ms 대기
        enableExponentialBackoff: true              # 점점 간격을 늘려 재시도 (200ms → 400ms → 800ms)
        exponentialBackoffMultiplier: 2

billing:
  pg:
    enabled: false                 # 로컬 dev: 실제 PG 호출 안 하고 MockPgClient 사용
    base-url: ${PG_BASE_URL:http://wiremock:8090}
  outbox:
    relay:
      enabled: false               # 로컬: Kafka 미연결이라 relay 비활성 (테이블 INSERT 만 발생)
      poll-interval-ms: 1000       # 매 1초 마다 outbox 테이블 polling
      batch-size: 100              # 한 polling cycle 에 최대 100건 처리 (메시지 단위 별도 tx)
      send-timeout-ms: 5000        # Kafka send 응답 5초 안에 못 받으면 timeout → 다음 polling 재시도
      topic-prefix: "billing."     # 토픽 명: billing.<aggregateType>.<eventType> (lowercase)
  cache:
    redis-enabled: false           # 로컬: Caffeine 만 (단일 인스턴스 in-memory L1 cache)
    local-ttl-seconds: 30          # L1 (Caffeine, 인스턴스 로컬) 캐시 TTL
    global-ttl-seconds: 300        # L2 (Redis, 인스턴스 공유) 캐시 TTL — prod 에서만 사용
  security:
    jwt:
      enabled: false               # 로컬: PermissiveSecurityConfig (JWT 검증 skip)
  idempotency:
    ttl-hours: 24                  # Idempotency-Key 점유 유지 시간 — 이 안에 같은 키 재시도는 거절

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:billing}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration,classpath:db/migration-postgres
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}

management:
  tracing:
    sampling:
      probability: 0.1

billing:
  pg:
    enabled: true
  outbox:
    relay:
      enabled: true
  cache:
    redis-enabled: true
  security:
    jwt:
      enabled: true
