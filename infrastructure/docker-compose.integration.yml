# Cross-repo 통합 시연용 docker-compose.
#
# 같은 portfolio 묶음의 다른 레포 (auth-service / notification-hub /
# bid-ask-marketplace / gpu-job-orchestrator) 가 본 레포 양쪽 끝에 매달려 있는
# 그림을 mock 으로 재현한다. mock 이지만 인터페이스 (HTTP / Kafka topic /
# JWT 모양) 는 실제 레포의 것과 같다.
#
# 구성 (3종 stub + 1종 message bus):
#   - kafka                     → outbox relay 가 발사하는 메시지 버스
#   - auth-stub  (wiremock)     → auth-service 흉내. /.well-known/openid-configuration
#                                 + /.well-known/jwks.json 노출
#   - notification-stub         → notification-hub 흉내. billing.* 토픽을 구독해
#                                 stdout 으로 dump (kafka-console-consumer)
#   - usage-producer            → bid-ask-marketplace + gpu-job-orchestrator 의
#                                 usage 발사 흉내. demo script 가 단발성으로 부른다
#
# billing-platform 본체는 옆 터미널에서 `./gradlew :billing-bootstrap:bootRun`
# 로 띄우는 걸 가정한다 (demo.sh 와 같은 방식). 이렇게 하면 dev 프로필
# (H2 + MockPgClient + JWT off) 그대로 동작하면서, outbox 만 kafka 로 흐름.
# 실행 방법:
#   docker compose -f infrastructure/docker-compose.integration.yml up -d --wait
#   BILLING_OUTBOX_RELAY_ENABLED=true KAFKA_BOOTSTRAP=localhost:9092 \
#     ./gradlew :billing-bootstrap:bootRun
#   scripts/integration-demo.sh
#   docker compose -f infrastructure/docker-compose.integration.yml down -v
services:
  kafka:
    image: bitnamilegacy/kafka:3.7   # bitnami/* 무료 카탈로그가 bitnamilegacy/ 로 이전됨(2025) — 같은 이미지
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 두 개의 리스너 — 컨테이너 안에서는 kafka:9092, host 에서는 localhost:9092.
      # 둘 다 9092 라 컨테이너 / 호스트 측 클라이언트가 같은 bootstrap-servers 값을 쓸 수 있음.
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 15

  # auth-service stub. JWK Set 만 정적으로 노출. 실제 auth-service 는 발급 흐름이
  # 더 풍부하지만, 여기서는 "다른 서비스가 이 issuer 의 토큰으로 본 레포를 호출한다"
  # 라는 그림 만 보여주면 됨. demo script 는 auth-stub 와 같은 키로 JWT 를 직접
  # 서명해서 시연.
  auth-stub:
    image: wiremock/wiremock:3.10.0   # alpine 변종은 arm64 manifest 가 없음
    command: ["--port", "8080", "--global-response-templating"]
    ports: ["8081:8080"]   # demo script 가 host 의 :8081 로 admin API 호출
    volumes:
      - ./integration/auth-stub:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/.well-known/openid-configuration >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  # notification-hub stub. billing.* 토픽 (invoice / payment / overdue / ...)
  # 을 구독해서 stdout 으로 dump. `docker compose logs notification-stub` 로 본다.
  notification-stub:
    image: bitnamilegacy/kafka:3.7   # console-consumer 만 쓰기 위한 같은 이미지 (bitnamilegacy = bitnami 무료 카탈로그 이전)
    entrypoint: ["/bin/sh", "/opt/notification-stub/consume.sh"]
    environment:
      BOOTSTRAP: kafka:29092         # 컨테이너 내부에서는 INTERNAL 리스너로
      TOPIC_REGEX: "billing[.].*"
    volumes:
      - ./integration/notification-stub:/opt/notification-stub:ro
    depends_on:
      kafka: { condition: service_healthy }

  # bid-ask-marketplace + gpu-job-orchestrator 가 발사하는 사용량 이벤트 흉내.
  # `--profile producer` 로만 뜸 — 평소엔 멱등성이 깨지니 demo script 가 단발성으로 부른다.
  usage-producer:
    profiles: [producer]
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "/opt/usage-producer/produce.sh"]
    environment:
      # billing-platform 은 host 의 gradle bootRun. docker desktop 의 host.docker.internal 로 접근.
      BILLING: http://host.docker.internal:8080
      CUSTOMER: acme-corp
    volumes:
      - ./integration/usage-producer:/opt/usage-producer:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
