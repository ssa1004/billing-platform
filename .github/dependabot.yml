# Dependabot — 의존성 / Actions 버전 자동 추적.
# 멀티모듈 Gradle 이지만 버전은 루트 build.gradle.kts + 각 모듈 build.gradle.kts 에
# 분산돼 있어 ecosystem 단위 (gradle) 로 한 번에 스캔한다 (디렉토리는 "/" — Gradle
# 플러그인이 settings.gradle.kts 의 include 를 따라 하위 모듈까지 본다).
#
# 알림/PR 소음을 줄이기 위한 정책:
#   - schedule.interval: monthly  (주간 → 월간으로 빈도 축소)
#   - open-pull-requests-limit: 5
#   - groups: 각 ecosystem 의 모든 업데이트를 PR 하나로 묶는다 (patterns: ["*"]).
version: 2
updates:
  # ─── Gradle 의존성 ───────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      # 레포 컨벤션 (Conventional Commits) 에 맞춤.
      prefix: "chore"
      include: "scope"
    groups:
      # 모든 gradle 의존성을 월 1회 PR 하나로 묶어 리뷰/알림 부담을 낮춘다.
      gradle-all:
        patterns:
          - "*"

  # ─── GitHub Actions ──────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # 모든 Actions 버전 업데이트를 PR 하나로 묶는다.
      github-actions-all:
        patterns:
          - "*"

  # ─── Docker base image ───────────────────────────────────────────
  # Dockerfile 의 eclipse-temurin base (builder/runtime 두 스테이지) 패치
  # 버전을 추적. OS CVE (openssl/libcrypto3 등) 는 runtime 의 apk upgrade 가
  # 1차로 막지만, base digest 자체가 갱신되면 dependabot 이 PR 을 연다.
  - package-ecosystem: "docker"
    directory: "/infrastructure"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # infrastructure 의 모든 Docker base image 업데이트를 PR 하나로 묶는다.
      docker-infrastructure-all:
        patterns:
          - "*"
