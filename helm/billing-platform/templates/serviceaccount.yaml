{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "billing-platform.serviceAccountName" . }}
  labels:
    {{- include "billing-platform.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken — billing-platform 자체는 K8s API 직접 호출 안 함.
# 그래도 Spring Cloud Kubernetes / Actuator 의 일부 기능이 token 을 기대할 수 있어
# default (true) 유지. IRSA / Workload Identity 환경에선 token 이 필요.
{{- end }}
