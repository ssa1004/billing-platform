services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "billing"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Kafka in KRaft mode (zookeeper-less). 로컬 단일 노드.
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Wiremock — PG 시뮬레이션. mappings 디렉토리를 마운트하면 stub 자동 로드.
  wiremock:
    image: wiremock/wiremock:3.10.0-alpine
    ports: ["8090:8080"]
    command: ["--port", "8080", "--verbose"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  # 운영 모드 시뮬레이션 — 위 4개 의존성 모두 구동된 상태에서 billing-platform 자체도 컨테이너로
  # 실제 빌드/실행은 docker compose --profile app up 처럼 profile 분리하면 됨
  billing-app:
    profiles: [app]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_USER: billing
      DB_PASSWORD: billing
      DB_NAME: billing
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      PG_BASE_URL: http://wiremock:8080
      OAUTH_ISSUER_URI: http://auth.local/dummy
      WALLET_SECURITY_JWT_ENABLED: "false"   # 데모용 — JWT 없이
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      wiremock: { condition: service_started }

volumes:
  pg-data:
