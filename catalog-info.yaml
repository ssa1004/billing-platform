kind: Component
metadata:
  name: billing-platform
  description: "B2B SaaS 결제 / 청구 / 정산 백엔드 — Wallet/PG 결제 + Metering/Pricing/Invoice/Settlement, advisory lock + Outbox + DLQ, Spring Batch"
  annotations:
    github.com/project-slug: ssa1004/billing-platform
    backstage.io/source-location: url:https://github.com/ssa1004/billing-platform
  tags:
    - billing
    - payment
    - usage-based-billing
    - settlement
    - outbox-pattern
    - saga
    - spring-modulith
  links:
    - url: https://github.com/ssa1004/billing-platform
      title: GitHub Repository
    - url: https://github.com/ssa1004/billing-platform/blob/main/README.md
      title: README
    - url: https://github.com/ssa1004/billing-platform/tree/main/docs/adr
