{{/*
Secret 은 *placeholder*. 운영에서는 외부 Secret manager (Sealed Secrets, External
Secrets Operator, Vault, AWS Secrets Manager 등) 가 미리 만들어 둔 Secret 을
existingSecret 으로 참조해야 함.

이 chart 가 Secret 을 직접 만드는 경우는 두 가지뿐:
1) dev / staging — 약한 default credential 로 빠르게 시연
2) e2e CI — ephemeral cluster 에서 ephemeral secret

이 둘 모두 .credentials.existingSecret 이 비어있을 때만 동작. prod values 는
existingSecret 을 항상 채워서 이 파일이 *아무것도 만들지 않도록* 강제.
*/}}

{{- if not .Values.postgres.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "billing-platform.fullname" . }}-db
  labels:
    {{- include "billing-platform.labels" . | nindent 4 }}
  annotations:
    # helm.sh/hook 안 씀 — 매 upgrade 마다 같이 흐르는 게 정상. rotation 은 외부.
    "helm.sh/resource-policy": keep   # uninstall 시에도 보존 — 실수로 uninstall 했을 때 secret 데이터 보호
type: Opaque
stringData:
  {{ .Values.postgres.credentials.usernameKey }}: {{ .Values.postgres.credentials.username | quote }}
  {{ .Values.postgres.credentials.passwordKey }}: {{ .Values.postgres.credentials.password | quote }}
{{- end }}

{{- if and (not .Values.redis.credentials.existingSecret) .Values.redis.credentials.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "billing-platform.fullname" . }}-redis
  labels:
    {{- include "billing-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{ .Values.redis.credentials.passwordKey }}: {{ .Values.redis.credentials.password | quote }}
{{- end }}

{{- if and (not .Values.pg.credentials.existingSecret) (or .Values.pg.credentials.apiKey .Values.pg.credentials.webhookSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "billing-platform.fullname" . }}-pg
  labels:
    {{- include "billing-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{ .Values.pg.credentials.apiKeyKey }}: {{ .Values.pg.credentials.apiKey | quote }}
  {{ .Values.pg.credentials.webhookSecretKey }}: {{ .Values.pg.credentials.webhookSecret | quote }}
{{- end }}
