apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-platform
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-platform
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # PDB 와 함께 zero-downtime
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-platform
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: billing-platform
      # Pod-level security: non-root + drop ALL caps + seccomp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-platform
          image: ghcr.io/your-org/billing-platform:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # ConfigMap 으로부터 모든 키 주입
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: billing-platform-config, key: DB_HOST } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: billing-platform-config, key: DB_NAME } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: billing-platform-config, key: REDIS_HOST } }
            - name: KAFKA_BOOTSTRAP
              valueFrom: { configMapKeyRef: { name: billing-platform-config, key: KAFKA_BOOTSTRAP } }
            - name: PG_BASE_URL
              valueFrom: { configMapKeyRef: { name: billing-platform-config, key: PG_BASE_URL } }
            - name: OAUTH_ISSUER_URI
              valueFrom: { configMapKeyRef: { name: billing-platform-config, key: OAUTH_ISSUER_URI } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: { configMapKeyRef: { name: billing-platform-config, key: OTEL_EXPORTER_OTLP_ENDPOINT } }
            - name: OTEL_SERVICE_NAME
              valueFrom: { configMapKeyRef: { name: billing-platform-config, key: OTEL_SERVICE_NAME } }
            # Secret 으로부터
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: billing-platform-secret, key: db.user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: billing-platform-secret, key: db.password } }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "1.5Gi"
          # Container-level security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Spring Boot 가 시작 시 Flyway 마이그레이션 + JPA 초기화 → 시작 시간 여유
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30   # 최대 ~150s
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Service endpoint 에서 빠지는 시간 + in-flight 요청 처리
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: tmp
          emptyDir: {}   # readOnlyRootFilesystem=true 일 때 /tmp 는 별도 volume
      terminationGracePeriodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: billing-platform
  namespace: billing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-platform
